<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Document</title>
  </head>
  <body>
    <img src="#" />
    <img id="randomimg" src="#" />
    <form>
      <input type="search" placeholder="Search..." />
      <button type="submit">Search</button>
    </form>
    <div class="search-result-item">
      <img src="placeholder.jpeg" alt="Search result preview" id="result-img" />
    </div>

    <script>
      const img = document.querySelector("img");

      fetch(
        "https://api.giphy.com/v1/gifs/NfzERYyiWcXU4?api_key=eskKJRvsnViqLDz7D1IExva4uwQFciIF",
      )
        .then(function (response) {
          return response.json();
        })
        .then(function (response) {
          img.src = response.data.images.original.url;
        })
        .catch(function (error) {
          console.log("Something went wrong:", error);
        });

      const fetchBtn = document.createElement("button");
      fetchBtn.classList.add("fetch-btn");
      fetchBtn.textContent = "CLICK TO GENERATE RANDOM PEPE GIFS";
      document.body.appendChild(fetchBtn);
      fetchBtn.addEventListener("click", () => {
        const randomImg = document.querySelector("#randomimg");
        fetch(
          "https://api.giphy.com/v1/gifs/random?api_key=eskKJRvsnViqLDz7D1IExva4uwQFciIF&tag=pepe-frog&rating=g",
        )
          .then(function (response) {
            return response.json();
          })
          .then(function (response) {
            randomImg.src = response.data.images.original.url;
          });
      });
      const form = document.querySelector("form");
      const searchBar = document.querySelector('input[type="search"]');
      
      form.addEventListener("submit", (event) => {
        event.preventDefault();
        fetch(
          `https://api.giphy.com/v1/gifs/search?api_key=mykey&q=${searchBar.value}&rating=g`,
        )
          .then(function (response) {
            if (!response.ok) {
              throw new Error(`HTTP error! status: ${response.status}`);
            }
            return response.json();
          })
          .then(function (response) {
             if (response.data.length === 0) {
              throw new Error(`Your search did not yield any results.`);
            }
            const randomIndex = Math.floor(
  Math.random() * response.data.length);
            const imgHolder = document.querySelector("#result-img");
            imgHolder.src = response.data[randomIndex].images.original.url;
          })
          .catch((error) => {
            console.error("Error fetching the gif", error);
          });
      });
    </script>
  </body>
</html>
