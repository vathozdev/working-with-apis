<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Document</title>
  </head>
  <body>
    <img src="#" />
    <img id="randomimg" src="#" />
    <script>
      const img = document.querySelector("img");

      fetch(
        "https://api.giphy.com/v1/gifs/NfzERYyiWcXU4?api_key=eskKJRvsnViqLDz7D1IExva4uwQFciIF",
      )
        .then(function (response) {
          return response.json();
        })
        .then(function (response) {
          img.src = response.data.images.original.url;
        })
        .catch(function (error) {
          console.log("Something went wrong:", error);
        });

      const fetchBtn = document.createElement("button");
      fetchBtn.classList.add("fetch-btn");
      fetchBtn.textContent = "CLICK TO GENERATE RANDOM PEPE GIFS";
         document.body.appendChild(fetchBtn);
      fetchBtn.addEventListener("click", () => {
        const randomImg = document.querySelector("#randomimg");
        fetch(
          "https://api.giphy.com/v1/gifs/random?api_key=mykey&tag=pepe-frog&rating=g",
        )
          .then(function (response) {
            return response.json();
          })
          .then(function (response) {
            randomImg.src = response.data.images.original.url;
          });
      });
   
    </script>
  </body>
</html>
